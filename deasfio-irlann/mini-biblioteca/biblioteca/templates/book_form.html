<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if is_editing %}Editar livro{% else %}Novo livro{% endif %}</title>
</head>
<body>
    <p><a href="{% url 'book_list' %}">&larr; Voltar para a lista de livros</a></p>
    <h1>{% if is_editing %}Editar livro{% else %}Novo livro{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if is_editing %}Editar livro{% else %}Novo livro{% endif %}</button>
    </form>
</body>
</html>
