<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Lista de Livros</title>
</head>
<body>
    <h1>Lista de Livros</h1>

    {% for book in books %}

        <h2>{{ book.title }}</h2>

        <p>
            <strong>Autores:</strong>
            {% for author in book.authors.all %}
                <a href="{% url 'author_detail' author.pk %}">{{ author.name }}</a>{% if not forloop.last %}, {% endif %}
            {% endfor %}
        </p>
        <p>
            <strong>Ano de Publicação do Livro:</strong> {{ book.year_of_publication }}
        </p>

    {% endfor %}
</body>
</html>
